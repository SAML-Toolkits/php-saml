# This workflow will install PHP dependencies, run tests and lint with a variety of PHP versions
# For more information see: https://github.com/marketplace/actions/setup-php-action

name: php-saml 3.x package

on:
  push:
    branches: [ 3.* ]
  pull_request:
    branches: [ 3.* ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        operating-system: ['ubuntu-22.04'] # ubuntu-22.04 has good support for the PHP 7.2–7.4 toolchain.
        php-versions: [7.2, 7.3, 7.4]
    steps:
      # Checkout FIRST so the workspace is ready for all later steps.
      # Pin to a full commit SHA for supply-chain safety.
      # To find the latest SHA for a tag, run:
      #   git ls-remote --tags https://github.com/actions/checkout.git | grep v4
      #   or check https://github.com/actions/checkout/releases
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Set git line-ending config
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      # Setup PHP
      # Pin to SHA. Right now using >= 2.37.1 which fixes CVE-2026-46420
      # Check https://github.com/shivammathur/setup-php/releases for latest.
      - name: Setup PHP ${{ matrix.php-versions }}, with composer and extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, intl, mcrypt, xml
          tools: composer:v2
          ini-values: post_max_size=256M, max_execution_time=180
          coverage: xdebug2

      - name: Install Composer 2.8.9
        run: |
          EXPECTED_SHA256="$(curl -sSf https://getcomposer.org/download/2.8.9/composer.phar.sha256sum | awk '{ print $1 }')"
          curl -sSf https://getcomposer.org/download/2.8.9/composer.phar -o /tmp/composer.phar
          ACTUAL_SHA256="$(sha256sum /tmp/composer.phar | awk '{ print $1 }')"
          if [ "$EXPECTED_SHA256" != "$ACTUAL_SHA256" ]; then
            echo "::error::Composer checksum mismatch!"
            exit 1
          fi
          sudo cp /tmp/composer.phar "$(which composer)"
          rm /tmp/composer.phar
          composer --version

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install Composer dependencies
        run: |
          composer install --prefer-source --no-interaction

      - name: Syntax check PHP
        run: |
          php vendor/bin/phpcpd --exclude tests --exclude vendor .
          php vendor/bin/phploc src/.
          mkdir -p tests/build/dependences
          php vendor/bin/pdepend --summary-xml=tests/build/logs/dependence-summary.xml --jdepend-chart=tests/build/dependences/jdepend.svg --overview-pyramid=tests/build/dependences/pyramid.svg  src/.

      - name: PHP Code Sniffer
        run: php vendor/bin/phpcs --standard=tests/ZendModStandard src/Saml2 demo1 demo2 endpoints tests/src

      - name: Run unit tests
        run: vendor/bin/phpunit --verbose --debug
